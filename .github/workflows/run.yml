name: Run TikTok History Scraper

on:
  schedule:
    # 設定定時執行：這裡設定為每天的 UTC 時間 0 點執行（台灣時間早上 8 點）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許你手動隨時在 GitHub 網頁上按鈕觸發執行

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 檢出程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 從 GitHub Secrets 還原 cookies.txt
      run: |
        echo "${{ secrets.COOKIES_CONTENT }}" > cookies.txt

    - name: 5. 執行主程式
      run: |
        python main.py

    - name: 6. 清理機密檔案
      if: always()
      run: |
        rm -f cookies.txt
