name: Run TikTok History Scraper

on:
  schedule:
    # 設定每 15 分鐘自動觸發一次 (UTC 時間)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允許你隨時手動點按鈕執行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 檢出程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Python 環境 (升級至 3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. 安裝與更新相依套件
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade yt-dlp
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. 從 GitHub Secrets 還原 cookies.txt
      run: |
        echo "${{ secrets.COOKIES_CONTENT }}" > cookies.txt

    - name: 5. 執行主程式
      run: |
        python main.py

    - name: 6. 自動 Commit 並上傳 all_historyvideos.txt 到倉庫
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add all_historyvideos.txt
        git commit -m "Auto-update all_historyvideos.txt via GitHub Actions Cron" || echo "No changes to commit"
        git push

    - name: 7. 清理機密檔案
      if: always()
      run: |
        rm -f cookies.txt
