name: Run TikTok History Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 檢出程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Python 環境 (升級至 3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. 安裝與更新相依套件
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade yt-dlp
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. 從 GitHub Secrets 還原 cookies.txt
      run: |
        echo "${{ secrets.COOKIES_CONTENT }}" > cookies.txt

    - name: 5. 執行主程式
      run: |
        python main.py

    - name: 6. 清理機密檔案
      if: always()
      run: |
        rm -f cookies.txt
